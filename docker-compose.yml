version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: my_app_container
    restart: always
    environment:
      - DB_HOST=db
      - DB_DATABASE=my_database
      - DB_USERNAME=root
      - DB_PASSWORD=secret
    ports:
      - "8095:8095"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: my_db_container
    restart: always
    environment:
      MYSQL_DATABASE: my_database
      MYSQL_USER: root
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: